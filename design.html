<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>moodify</title>

  <!-- 폰트: Nunito(제목) + Outfit(본문) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ═══════════════════════════════════════════════════════════════
       디자인 토큰 — 색과 폰트를 여기서 한 번에 바꿀 수 있어요
       ═══════════════════════════════════════════════════════════════ */
    :root {
      --font-display: 'Nunito', sans-serif;   /* 제목용 폰트 */
      --font-body: 'Outfit', sans-serif;      /* 본문용 폰트 */

      --purple: #a855f7;
      --pink: #ec4899;
      --deep: #2d1554;
      --muted: #9b72cf;
      --muted-soft: #b89ad6;

      --card-bg: rgba(255, 255, 255, 0.62);
      --card-border: rgba(168, 85, 247, 0.12);
    }

    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; margin: 0; padding: 0; }
    ::-webkit-scrollbar { display: none; }

    body {
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #ece9f5;
      padding: 20px;
    }

    /* ── 폰 껍데기 ─────────────────────────────────────────────── */
    .phone {
      position: relative;
      width: 390px; height: 844px;
      border-radius: 44px; overflow: hidden;
      box-shadow: 0 32px 80px rgba(124, 111, 239, 0.22), 0 4px 16px rgba(0, 0, 0, 0.08);
      display: flex; flex-direction: column;
    }
    .statusbar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 20;
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 32px 4px; pointer-events: none;
    }
    .statusbar__time { font-weight: 600; font-size: 14px; color: #5b3d8a; }
    .statusbar__notch { width: 16px; height: 12px; border-radius: 3px; border: 2px solid #5b3d8a; opacity: 0.7; }
    .phone:has(.screen--results.is-active) .statusbar__time,
    .phone:has(.screen--results.is-active) .statusbar__notch { color: #e9d5ff; border-color: #e9d5ff; }

    /* ── 화면 전환: is-active가 붙은 화면만 보임 ───────────────── */
    .screen { position: absolute; inset: 0; display: none; flex-direction: column; padding-top: 44px; }
    .screen.is-active { display: flex; }

    /* ── 공통 부품 ─────────────────────────────────────────────── */
    .icon-btn {
      width: 38px; height: 38px; border-radius: 12px;
      background: rgba(168, 85, 247, 0.10); border: 1.5px solid rgba(168, 85, 247, 0.20);
      display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
    }
    .icon-btn--dark { background: rgba(255, 255, 255, 0.10); border-color: rgba(255, 255, 255, 0.18); }
    .icon-btn--ghost { background: none; border: none; cursor: default; }
    .section-label { font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--muted); margin: 22px 0 12px; }

    /* ═══════════════════════════════════════════════════════════════
       화면 1: 홈 / 입력
       ═══════════════════════════════════════════════════════════════ */
    .screen--home { background: linear-gradient(145deg, #f3e8ff 0%, #fce7f3 35%, #fff7ed 70%, #ecfdf5 100%); }
    .home__scroll { flex: 1; overflow-y: auto; padding: 8px 28px 0; }
    .home__header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand__logo {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 18px; box-shadow: 0 4px 14px rgba(168, 85, 247, 0.4);
    }
    .brand__name { font-family: var(--font-display); font-weight: 800; font-size: 22px; color: #3b1f6b; letter-spacing: -0.3px; }
    .home__title { font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1.2; color: var(--deep); letter-spacing: -0.5px; }
    .home__subtitle { font-weight: 400; font-size: 14px; color: var(--muted); margin-top: 6px; }

    .textarea-card {
      position: relative; margin-top: 20px;
      background: rgba(255, 255, 255, 0.55); backdrop-filter: blur(12px);
      border: 1.5px solid rgba(168, 85, 247, 0.12); border-radius: 24px;
      padding: 18px; height: 150px;
    }
    .textarea-card textarea {
      width: 100%; height: 100%; border: none; outline: none; resize: none;
      background: transparent; font-family: var(--font-body); font-size: 15px; color: #3b1f6b; line-height: 1.5;
    }
    .textarea-card textarea::placeholder { color: #c4a8e0; }
    .textarea-card__count { position: absolute; right: 16px; bottom: 12px; font-size: 12px; color: var(--muted-soft); }

    .input-row { display: flex; gap: 10px; margin-top: 14px; }
    .pill-input {
      flex: 1; display: flex; align-items: center; gap: 8px;
      height: 52px; padding: 0 16px;
      background: rgba(255, 255, 255, 0.55); backdrop-filter: blur(12px);
      border: 1.5px solid rgba(168, 85, 247, 0.12); border-radius: 100px;
    }
    .pill-input input { width: 100%; border: none; outline: none; background: transparent; font-family: var(--font-body); font-size: 13px; color: #3b1f6b; }
    .pill-input input::placeholder { color: #c4a8e0; }

    .mood-chips { display: flex; flex-wrap: wrap; gap: 10px; }
    .mood-chip {
      display: flex; align-items: center; gap: 6px; padding: 10px 16px;
      background: rgba(255, 255, 255, 0.55); border: 1.5px solid rgba(168, 85, 247, 0.15);
      border-radius: 100px; font-family: var(--font-body); font-weight: 500; font-size: 13px;
      color: #5b3d8a; cursor: pointer; transition: transform 0.12s, box-shadow 0.12s, background 0.12s;
    }
    .mood-chip__emoji { font-size: 15px; }
    .mood-chip.is-selected {
      background: linear-gradient(135deg, var(--purple), var(--pink));
      color: white; border-color: transparent; box-shadow: 0 4px 14px rgba(168, 85, 247, 0.35);
    }
    .mood-chip:active { transform: scale(0.96); }

    .home__cta { padding: 12px 28px 28px; }
    .cta-btn {
      width: 100%; height: 60px; display: flex; align-items: center; justify-content: center; gap: 8px;
      background: linear-gradient(135deg, var(--purple), var(--pink)); border: none; border-radius: 20px;
      font-family: var(--font-display); font-weight: 700; font-size: 17px; color: white; cursor: pointer;
      box-shadow: 0 8px 24px rgba(168, 85, 247, 0.4); transition: transform 0.12s;
    }
    .cta-btn:active { transform: scale(0.98); }

    /* ═══════════════════════════════════════════════════════════════
       화면 2: 추천 결과 (앨범 커버 4장 + 재생 버튼)
       ═══════════════════════════════════════════════════════════════ */
    .screen--results { background: linear-gradient(160deg, #3b1f6b 0%, #2d1554 50%, #1e0f3d 100%); padding: 44px 24px 0; }
    .results__header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .results__heading { flex: 1; }
    .results__mood { font-size: 13px; color: #c4b5fd; font-weight: 500; }
    .results__title { font-family: var(--font-display); font-weight: 800; font-size: 22px; color: white; letter-spacing: -0.4px; margin-top: 2px; }

    .song-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; flex: 1; align-content: start; }
    .song-card { background: none; border: none; padding: 0; cursor: pointer; text-align: left; }
    .song-card__art { position: relative; width: 100%; aspect-ratio: 1; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3); }
    .song-card__art img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s, filter 0.3s; }
    .song-card__play {
      position: absolute; right: 10px; bottom: 10px; width: 34px; height: 34px; border-radius: 50%;
      background: rgba(0, 0, 0, 0.45); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center; transition: opacity 0.2s;
    }
    .song-card.is-playing .song-card__art img { filter: brightness(0.6); transform: scale(1.05); }
    .song-card.is-playing .song-card__play { opacity: 0; }
    .song-card__title { font-family: var(--font-display); font-weight: 700; font-size: 15px; color: white; margin-top: 10px; letter-spacing: -0.2px; }
    .song-card__artist { font-size: 12.5px; color: #a78bda; margin-top: 1px; }

    /* 재생 중일 때 나오는 이퀄라이저 막대 애니메이션 */
    .eq { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; gap: 4px; }
    .song-card.is-playing .eq { display: flex; }
    .eq i { width: 4px; height: 14px; border-radius: 2px; background: white; animation: eq 0.8s ease-in-out infinite; }
    .eq i:nth-child(2) { animation-delay: 0.2s; }
    .eq i:nth-child(3) { animation-delay: 0.4s; }
    .eq i:nth-child(4) { animation-delay: 0.15s; }
    @keyframes eq { 0%, 100% { height: 8px; } 50% { height: 26px; } }

    .results__save { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 18px; margin: 16px 0 24px; font-family: var(--font-display); font-weight: 600; font-size: 15px; color: #c4b5fd; cursor: pointer; }
    .results__save-icon { width: 26px; height: 26px; border-radius: 50%; background: rgba(196, 181, 253, 0.15); display: flex; align-items: center; justify-content: center; font-size: 18px; line-height: 1; }

    /* ═══════════════════════════════════════════════════════════════
       화면 3: 캘린더 / 음악 기록
       ═══════════════════════════════════════════════════════════════ */
    .screen--calendar { background: linear-gradient(145deg, #f3e8ff 0%, #fce7f3 40%, #fff7ed 100%); }
    .cal__scroll { flex: 1; overflow-y: auto; padding: 8px 24px 28px; }
    .cal__header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .cal__title { font-family: var(--font-display); font-weight: 800; font-size: 20px; color: var(--deep); letter-spacing: -0.4px; }

    .cal__grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 8px; }
    .cal__weekday { text-align: center; font-size: 12px; font-weight: 600; color: var(--muted-soft); padding-bottom: 6px; }
    .cal__cell {
      position: relative; aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      border: none; background: none; font-family: var(--font-body); font-size: 14px; color: #b89ad6; border-radius: 12px;
    }
    .cal__cell--empty { visibility: hidden; }
    .cal__cell--has { color: var(--deep); font-weight: 600; cursor: pointer; background: rgba(255, 255, 255, 0.5); }
    .cal__cell--has:hover { background: rgba(255, 255, 255, 0.8); }
    .cal__cell.is-selected { background: linear-gradient(135deg, var(--purple), var(--pink)); color: white; box-shadow: 0 4px 14px rgba(168, 85, 247, 0.35); }
    .cal__dot { position: absolute; bottom: 6px; width: 5px; height: 5px; border-radius: 50%; background: var(--pink); }
    .cal__cell.is-selected .cal__dot { background: white; }

    .cal__timeline { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
    .timeline-empty { text-align: center; color: var(--muted-soft); font-size: 13px; padding: 30px 0; }
    .record { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--card-bg); backdrop-filter: blur(12px); border: 1.5px solid var(--card-border); border-radius: 18px; }
    .record__time { font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--muted); width: 42px; flex-shrink: 0; }
    .record__bar { width: 3px; height: 34px; border-radius: 2px; flex-shrink: 0; }
    .record__body { flex: 1; min-width: 0; }
    .record__title { font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--deep); }
    .record__artist { font-size: 12px; color: #7c6fba; margin-top: 1px; }
    .record__mood { font-size: 12px; color: var(--muted); flex-shrink: 0; }

    @media (prefers-reduced-motion: reduce) { .eq i { animation: none; height: 14px; } }
  </style>
</head>
<body>
  <div class="phone">
    <!-- 상단 상태바 (시계 · 노치) -->
    <div class="statusbar">
      <span class="statusbar__time">9:41</span>
      <span class="statusbar__notch"></span>
    </div>

    <!-- ─── 화면 1: 홈 ─────────────────────────────────────────── -->
    <section class="screen screen--home is-active" data-screen="home">
      <div class="home__scroll">
        <header class="home__header">
          <div class="brand">
            <span class="brand__logo">✦</span>
            <span class="brand__name">moodify</span>
          </div>
          <button class="icon-btn" data-goto="calendar" aria-label="캘린더 열기">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <rect x="3" y="4.5" width="14" height="12" rx="2.5" stroke="#a855f7" stroke-width="1.6"/>
              <path d="M3 8h14M7 3v3M13 3v3" stroke="#a855f7" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
        </header>

        <h1 class="home__title">What's your<br />mood now?</h1>
        <p class="home__subtitle">지금 상황을 자유롭게 적어보세요</p>

        <div class="textarea-card">
          <textarea id="situation" maxlength="200" placeholder="예) 한강 공원에서 러닝 중!"></textarea>
          <span class="textarea-card__count"><span id="charCount">0</span>/200</span>
        </div>

        <div class="input-row">
          <label class="pill-input">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="6" r="3" stroke="#a855f7" stroke-width="1.5"/><path d="M4 15c0-2.5 2.2-4 5-4s5 1.5 5 4" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round"/></svg>
            <input type="text" placeholder="듣고 싶은 가수" />
          </label>
          <label class="pill-input">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="6" cy="12" r="2.4" stroke="#a855f7" stroke-width="1.5"/><path d="M8.4 12V4l6-1.5V10" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <input type="text" placeholder="듣고 싶은 장르" />
          </label>
        </div>

        <p class="section-label">추천 무드</p>
        <div class="mood-chips" id="moodChips"><!-- JS가 채웁니다 --></div>
      </div>

      <div class="home__cta">
        <button class="cta-btn" data-goto="results">
          찾아보기
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M4 9h9M9 5l4 4-4 4" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </section>

    <!-- ─── 화면 2: 추천 결과 ──────────────────────────────────── -->
    <section class="screen screen--results" data-screen="results">
      <header class="results__header">
        <button class="icon-btn icon-btn--dark" data-goto="home" aria-label="뒤로">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="#e9d5ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="results__heading">
          <p class="results__mood"><span id="resultEmoji">🏃</span> <span id="resultMood">러닝 중</span></p>
          <h2 class="results__title">이런 곡은 어때요?</h2>
        </div>
        <button class="icon-btn icon-btn--dark" data-goto="calendar" aria-label="캘린더 열기">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2.5" y="4" width="13" height="11" rx="2.5" stroke="#e9d5ff" stroke-width="1.6"/><path d="M2.5 7.5h13M6.5 2.5v3M11.5 2.5v3" stroke="#e9d5ff" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </header>

      <div class="song-grid" id="songGrid"><!-- JS가 앨범 4장을 채웁니다 --></div>

      <div class="results__save">
        <span class="results__save-icon">＋</span>
        플레이리스트 저장하기
      </div>
    </section>

    <!-- ─── 화면 3: 캘린더 ─────────────────────────────────────── -->
    <section class="screen screen--calendar" data-screen="calendar">
      <div class="cal__scroll">
        <header class="cal__header">
          <button class="icon-btn" data-goto="home" aria-label="뒤로">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <h2 class="cal__title">2026년 9월</h2>
          <span class="icon-btn icon-btn--ghost"></span>
        </header>

        <div class="cal__grid" id="calGrid"><!-- JS가 날짜를 채웁니다 --></div>
        <div class="cal__timeline" id="timeline"></div>
      </div>
    </section>
  </div>

  <script>
  // ═══════════════════════════════════════════════════════════════════
  //  가짜 데이터 — 백엔드가 완성되기 전까지 이 데이터로 디자인합니다.
  //  나중에 서버에서 받아오도록 바꾸면 되고, 지금은 여기 값만 고치면
  //  화면이 바로 바뀝니다.
  // ═══════════════════════════════════════════════════════════════════

  // 추천 결과 화면의 앨범 4장
  const SONGS = [
    { title: "Runners High", artist: "IU",       color: "#e879a0", img: "https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=400&h=400&fit=crop&auto=format" },
    { title: "밤편지",        artist: "IU",       color: "#7c6fef", img: "https://images.unsplash.com/photo-1506157786151-b8491531f063?w=400&h=400&fit=crop&auto=format" },
    { title: "ELEVEN",       artist: "IVE",      color: "#f9a75b", img: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=400&h=400&fit=crop&auto=format" },
    { title: "Ditto",        artist: "NewJeans", color: "#5bbfef", img: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400&h=400&fit=crop&auto=format" },
  ];

  // 홈 화면의 추천 무드 칩
  const MOODS = [
    { emoji: "🏃", label: "러닝" },
    { emoji: "🌙", label: "새벽 감성" },
    { emoji: "☕", label: "카페" },
    { emoji: "🌸", label: "봄 산책" },
    { emoji: "💫", label: "힐링" },
  ];

  // 캘린더의 날짜별 감상 기록 (2026년 9월)
  const HISTORY = {
    "2026-09-16": [
      { time: "07:32", title: "Runners High", artist: "IU",       mood: "🏃 러닝 중",   color: "#e879a0" },
      { time: "09:15", title: "ELEVEN",       artist: "IVE",      mood: "☀️ 출근길",    color: "#f9a75b" },
      { time: "13:04", title: "Ditto",        artist: "NewJeans", mood: "☕ 점심 카페",  color: "#5bbfef" },
      { time: "18:47", title: "밤편지",        artist: "IU",       mood: "🌙 퇴근 후",   color: "#7c6fef" },
    ],
    "2026-09-15": [
      { time: "08:10", title: "Ditto",  artist: "NewJeans", mood: "🌸 산책 중",   color: "#5bbfef" },
      { time: "22:30", title: "밤편지", artist: "IU",       mood: "🌙 새벽 감성", color: "#7c6fef" },
    ],
    "2026-09-14": [
      { time: "11:00", title: "ELEVEN",       artist: "IVE",      mood: "💫 힐링",   color: "#f9a75b" },
      { time: "14:22", title: "Runners High", artist: "IU",       mood: "🏃 러닝 중", color: "#e879a0" },
      { time: "20:05", title: "Ditto",        artist: "NewJeans", mood: "☕ 카페",   color: "#5bbfef" },
    ],
    "2026-09-13": [
      { time: "07:55", title: "Runners High", artist: "IU", mood: "🏃 러닝 중", color: "#e879a0" },
    ],
    "2026-09-12": [
      { time: "19:30", title: "밤편지", artist: "IU",  mood: "🌙 새벽 감성", color: "#7c6fef" },
      { time: "21:10", title: "ELEVEN", artist: "IVE", mood: "💫 힐링",     color: "#f9a75b" },
    ],
  };

  // 캘린더 설정
  const WEEK_DAYS = ["일", "월", "화", "수", "목", "금", "토"];
  const FIRST_WEEKDAY = 2;   // 9/1이 화요일 → 앞에 빈 칸 2개
  const DAYS_IN_MONTH = 30;

  // ═══════════════════════════════════════════════════════════════════
  //  화면 그리기 + 동작
  // ═══════════════════════════════════════════════════════════════════
  (function () {
    "use strict";

    // ── 홈: 무드 칩 그리기 ──────────────────────────────────────
    const moodChips = document.getElementById("moodChips");
    moodChips.innerHTML = MOODS.map(
      (m) => `<button class="mood-chip" data-mood="${m.label}" data-emoji="${m.emoji}">
                <span class="mood-chip__emoji">${m.emoji}</span>${m.label}
              </button>`
    ).join("");

    // ── 결과: 앨범 4장 그리기 ───────────────────────────────────
    const songGrid = document.getElementById("songGrid");
    songGrid.innerHTML = SONGS.map(
      (s) => `<button class="song-card" style="--song-color:${s.color}">
                <div class="song-card__art" style="background-color:${s.color}">
                  <img src="${s.img}" alt="${s.title}" loading="lazy" />
                  <span class="song-card__play">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="white"><path d="M5 3.5v9l7-4.5z"/></svg>
                  </span>
                  <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
                </div>
                <p class="song-card__title">${s.title}</p>
                <p class="song-card__artist">${s.artist}</p>
              </button>`
    ).join("");

    // ── 캘린더: 요일 + 날짜 그리기 ──────────────────────────────
    const calGrid = document.getElementById("calGrid");
    let cells = WEEK_DAYS.map((d) => `<span class="cal__weekday">${d}</span>`).join("");
    for (let i = 0; i < FIRST_WEEKDAY; i++) cells += `<span class="cal__cell cal__cell--empty"></span>`;
    for (let day = 1; day <= DAYS_IN_MONTH; day++) {
      const key = `2026-09-${String(day).padStart(2, "0")}`;
      const has = key in HISTORY;
      cells += `<button class="cal__cell${has ? " cal__cell--has" : ""}" data-date="${key}" ${has ? "" : "disabled"}>
                  ${day}${has ? '<span class="cal__dot"></span>' : ""}
                </button>`;
    }
    calGrid.innerHTML = cells;

    // ── 화면 전환 ───────────────────────────────────────────────
    const screens = document.querySelectorAll(".screen");
    function goTo(name) {
      screens.forEach((s) => s.classList.toggle("is-active", s.dataset.screen === name));
      if (name === "results") applyMood();
    }
    document.querySelectorAll("[data-goto]").forEach((btn) => {
      btn.addEventListener("click", () => goTo(btn.dataset.goto));
    });

    // ── 홈: 글자 수 카운터 ──────────────────────────────────────
    const situation = document.getElementById("situation");
    const charCount = document.getElementById("charCount");
    situation.addEventListener("input", () => { charCount.textContent = situation.value.length; });

    // ── 홈: 무드 칩 선택 ────────────────────────────────────────
    let selectedMood = "러닝", selectedEmoji = "🏃";
    const chips = document.querySelectorAll(".mood-chip");
    chips.forEach((chip) => {
      chip.addEventListener("click", () => {
        chips.forEach((c) => c.classList.remove("is-selected"));
        chip.classList.add("is-selected");
        selectedMood = chip.dataset.mood;
        selectedEmoji = chip.dataset.emoji;
      });
    });
    function applyMood() {
      document.getElementById("resultMood").textContent = selectedMood + " 중";
      document.getElementById("resultEmoji").textContent = selectedEmoji;
    }

    // ── 결과: 재생 토글 (한 번에 하나만) ────────────────────────
    const songCards = document.querySelectorAll(".song-card");
    songCards.forEach((card) => {
      card.addEventListener("click", () => {
        const playing = card.classList.contains("is-playing");
        songCards.forEach((c) => c.classList.remove("is-playing"));
        if (!playing) card.classList.add("is-playing");
      });
    });

    // ── 캘린더: 날짜 선택 → 기록 표시 ───────────────────────────
    const timeline = document.getElementById("timeline");
    function renderTimeline(dateKey) {
      const records = HISTORY[dateKey] || [];
      if (records.length === 0) {
        timeline.innerHTML = '<p class="timeline-empty">이 날의 기록이 없어요</p>';
        return;
      }
      timeline.innerHTML = records.map(
        (r) => `<div class="record">
                  <span class="record__time">${r.time}</span>
                  <span class="record__bar" style="background:${r.color}"></span>
                  <div class="record__body">
                    <p class="record__title">${r.title}</p>
                    <p class="record__artist">${r.artist}</p>
                  </div>
                  <span class="record__mood">${r.mood}</span>
                </div>`
      ).join("");
    }
    const dateCells = document.querySelectorAll(".cal__cell--has");
    dateCells.forEach((cell) => {
      cell.addEventListener("click", () => {
        dateCells.forEach((c) => c.classList.remove("is-selected"));
        cell.classList.add("is-selected");
        renderTimeline(cell.dataset.date);
      });
    });
    // 기본 선택: 기록이 있는 첫 날짜    
    if (dateCells.length > 0) {
      dateCells[0].classList.add("is-selected");
      renderTimeline(dateCells[0].dataset.date);
    }
  })();
  </script>
</body>
</html>
